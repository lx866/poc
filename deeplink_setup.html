<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ShortVideo Setup</title>
<style>
body{font-family:sans-serif;margin:24px;background:#111;color:#eee;text-align:center}
a{display:block;margin:24px auto;padding:16px;background:#1f6feb;color:#fff;text-decoration:none;border-radius:8px;font-size:16px;max-width:320px}
.hint{color:#aaa;font-size:13px;line-height:1.6;margin:12px 0}
</style>
</head>
<body>
<h1>ShortVideo Setup</h1>
<p class="hint">Redirecting to hiboard deeplink (launchedFromUid = browser)…</p>
<a id="setupLink" href="#">Tap if not redirected</a>
<script>
(function(){
  var base = 'hiboard://com.huawei.intelligent/shortVideo';
  var setup = base + '?page_key=shortvideo&page_tab=VIDEOS';
  var link = document.getElementById('setupLink');
  link.href = setup;
  setTimeout(function(){ location.href = setup; }, 600);
})();
</script>
</body>
</html>
