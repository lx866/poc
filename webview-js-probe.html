<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>WebView JS Bridge 探测</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #0f1419;
      --panel: #1a2332;
      --text: #e7ecf3;
      --muted: #93a1b3;
      --ok: #3ddc84;
      --warn: #ffb74d;
      --bad: #ff6b6b;
      --line: #2a3544;
      --accent: #2563eb;
      --mono: ui-monospace, Menlo, Consolas, monospace;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f4f6f9;
        --panel: #fff;
        --text: #1a2332;
        --muted: #5c6b7f;
        --line: #d8dee8;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    .wrap { max-width: 720px; margin: 0 auto; padding: 16px 14px 40px; }
    h1 { font-size: 1.25rem; margin: 0 0 4px; }
    .sub { color: var(--muted); font-size: 0.88rem; margin: 0 0 14px; }
    section {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 12px 14px;
      margin-bottom: 10px;
    }
    section h2 { margin: 0 0 8px; font-size: 0.95rem; }
    .pill {
      display: inline-block;
      font-size: 0.72rem;
      padding: 2px 8px;
      border-radius: 999px;
      background: color-mix(in srgb, var(--ok) 18%, transparent);
      color: var(--ok);
    }
    .pill.no {
      background: color-mix(in srgb, var(--bad) 15%, transparent);
      color: var(--bad);
    }
    .pill.warn {
      background: color-mix(in srgb, var(--warn) 18%, transparent);
      color: var(--warn);
    }
    button {
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--text);
      border-radius: 8px;
      padding: 10px 8px;
      font: inherit;
      font-size: 0.85rem;
      cursor: pointer;
    }
    button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    button.danger { border-color: var(--bad); color: var(--bad); }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 10px 0; }
    .row { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0; }
    pre, code { font-family: var(--mono); font-size: 0.78rem; }
    pre {
      margin: 0;
      white-space: pre-wrap;
      word-break: break-word;
      background: color-mix(in srgb, var(--bg) 70%, transparent);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px;
      max-height: 360px;
      overflow: auto;
    }
    #env-info { font-size: 0.82rem; color: var(--muted); margin-top: 6px; }
    #env-info code { color: var(--text); word-break: break-all; }
    .hint { font-size: 0.82rem; color: var(--muted); margin-top: 6px; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>WebView JS Bridge 探测</h1>
    <p class="sub">
      荣耀小游戏 WebView · <code>Native.nativeMethod(class, op, params, id, callbackName)</code><br>
      operation 格式 <code>default.方法名</code> · 回调 <code>{ ret, errMsg, callbackId, data }</code>
    </p>

    <section>
      <h2>环境</h2>
      <div id="native-status"><span class="pill warn">检测中…</span></div>
      <div id="env-info"></div>
      <div class="hint" id="api-hint"></div>
    </section>

    <section>
      <h2>Bridge 调用</h2>
      <div class="grid">
        <button type="button" class="primary" id="btn-list">枚举 API</button>
        <button type="button" id="btn-oaid">getOAID</button>
        <button type="button" id="btn-islogin">isLogin</button>
        <button type="button" id="btn-userinfo">getUserInfo</button>
        <button type="button" id="btn-login">toHonorLogin</button>
        <button type="button" id="btn-children">isChildrenMode</button>
        <button type="button" id="btn-report">reportEvent</button>
        <button type="button" id="btn-endloading">endLoading</button>
        <button type="button" id="btn-finish" class="danger">finishPage</button>
        <button type="button" id="btn-batch">批量(安全项)</button>
      </div>
      <div class="row">
        <button type="button" id="btn-copy">复制日志</button>
        <button type="button" id="btn-clear">清空</button>
      </div>
    </section>

    <section>
      <h2>日志</h2>
      <pre id="log">等待操作…</pre>
    </section>

    <section>
      <h2>JSON</h2>
      <pre id="report">{}</pre>
    </section>
  </div>

  <script>
  (function () {
    var IMPL = "com.hihonor.quickgamecenter.h5.method.JSMethodImpl";
    var seq = 0;
    var logs = [];
    var enumeratedApis = null;

    var $log = document.getElementById("log");
    var $report = document.getElementById("report");
    var $status = document.getElementById("native-status");
    var $env = document.getElementById("env-info");
    var $hint = document.getElementById("api-hint");

    function hasNative() {
      return window.Native && typeof window.Native.nativeMethod === "function";
    }

    function ts() { return new Date().toLocaleTimeString(); }

    function log(msg, data) {
      logs.push({ time: new Date().toISOString(), msg: msg, data: data != null ? data : null });
      var line = "[" + ts() + "] " + msg;
      if (data != null) line += "\n" + JSON.stringify(data, null, 2);
      if ($log.textContent === "等待操作…") $log.textContent = "";
      $log.textContent += line + "\n\n";
      $log.scrollTop = $log.scrollHeight;
      syncReport();
    }

    function syncReport() {
      var r = {
        env: { href: location.href, ua: navigator.userAgent, native: hasNative() },
        apis: enumeratedApis,
        calls: logs.slice()
      };
      $report.textContent = JSON.stringify(r, null, 2);
      window.__WEBVIEW_JS_PROBE__ = r;
    }

    function renderEnv() {
      if (hasNative()) {
        $status.innerHTML = '<span class="pill">Native OK</span> window.Native.nativeMethod 可用';
      } else {
        $status.innerHTML = '<span class="pill no">Native 不可用</span> 请在荣耀 WebViewActivity 中打开';
      }
      $env.innerHTML = "URL: <code>" + location.href + "</code>";
      syncReport();
    }

    /** 第5参数：全局函数名字符串，Native 会执行 callbackName(res) */
    function regCallback(label) {
      var name = "__cb_" + (++seq);
      window[name] = function (res) {
        log(label + " ←", res);
        if (res && res.ret === 0) log(label + " ✓", res.data != null ? res.data : res);
        else if (res && res.ret) log(label + " ✗ ret=" + res.ret, res.errMsg || res);
        try { delete window[name]; } catch (e) {}
      };
      return name;
    }

    function nativeCall(method, params, label) {
      if (!hasNative()) { log("ERROR: 无 Native"); return; }
      label = label || method;
      var cb = regCallback(label);
      var id = String(++seq);
      var ps = typeof params === "string" ? params : JSON.stringify(params || {});
      log("→ default." + method, { id: id, params: ps });
      try {
        Native.nativeMethod("", "default." + method, ps, id, cb);
      } catch (e1) {
        log("重试 " + IMPL + "." + method, { err: String(e1.message || e1) });
        try {
          Native.nativeMethod(IMPL, method, ps, id, cb);
        } catch (e2) {
          log("失败", { err: String(e2.message || e2) });
        }
      }
    }

    function listApis() {
      if (!hasNative()) return;
      var cb = regCallback("getHnrJsApiList");
      log("→ default.getHnrJsApiList");
      var old = window[cb];
      window[cb] = function (res) {
        enumeratedApis = res;
        if (res && res.data) $hint.textContent = "API: " + JSON.stringify(res.data);
        syncReport();
        if (old) old(res);
      };
      try {
        Native.nativeMethod("", "default.getHnrJsApiList", "{}", "list1", cb);
      } catch (e) {
        log("枚举失败", { err: String(e.message || e) });
      }
    }

    function batchSafe() {
      var ops = [
        ["getHnrJsApiList", {}],
        ["getOAID", {}],
        ["isLogin", { toLogin: false }],
        ["isChildrenMode", {}],
        ["endLoading", {}]
      ];
      var i = 0;
      log("批量开始", null);
      (function next() {
        if (i >= ops.length) { log("批量结束", null); return; }
        var op = ops[i++];
        nativeCall(op[0], op[1]);
        setTimeout(next, 700);
      })();
    }

    document.getElementById("btn-list").onclick = listApis;
    document.getElementById("btn-oaid").onclick = function () { nativeCall("getOAID", {}); };
    document.getElementById("btn-islogin").onclick = function () { nativeCall("isLogin", { toLogin: false }); };
    document.getElementById("btn-userinfo").onclick = function () { nativeCall("getUserInfo", { isRefresh: false }); };
    document.getElementById("btn-login").onclick = function () { nativeCall("toHonorLogin", {}); };
    document.getElementById("btn-children").onclick = function () { nativeCall("isChildrenMode", {}); };
    document.getElementById("btn-report").onclick = function () {
      nativeCall("reportEvent", {
        eventId: "webview_js_probe",
        args: JSON.stringify({ page: location.href, t: Date.now() }),
        isTimely: true
      });
    };
    document.getElementById("btn-endloading").onclick = function () { nativeCall("endLoading", {}); };
    document.getElementById("btn-finish").onclick = function () {
      if (confirm("关闭 WebView？")) nativeCall("finishPage", {});
    };
    document.getElementById("btn-batch").onclick = batchSafe;
    document.getElementById("btn-clear").onclick = function () {
      logs = []; $log.textContent = "等待操作…"; syncReport();
    };
    document.getElementById("btn-copy").onclick = function () {
      var t = $log.textContent;
      if (navigator.clipboard) navigator.clipboard.writeText(t).catch(function () { prompt("复制:", t); });
      else prompt("复制:", t);
    };

    renderEnv();
    if (hasNative()) setTimeout(listApis, 500);
  })();
  </script>
</body>
</html>
